spring:
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: hn-exam
  config:
    import: optional:file:../.env.local[.properties],optional:file:./.env.local[.properties]
  datasource:
    url: jdbc:h2:file:./data/hnexam;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    hikari:
      # Parent-row locks serialize a candidate's writes; avoid cross-candidate gap locks.
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: ${HNEXAM_DB_POOL_MAX:30}
      minimum-idle: ${HNEXAM_DB_POOL_MIN:5}
      connection-timeout: ${HNEXAM_DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 64
  h2:
    console:
      enabled: false
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      repositories:
        enabled: false
      host: ${HNEXAM_REDIS_HOST:127.0.0.1}
      port: ${HNEXAM_REDIS_PORT:6379}
      password: ${HNEXAM_REDIS_PASSWORD:}
      database: ${HNEXAM_REDIS_DATABASE:0}
      connect-timeout: 500ms
      timeout: 500ms

server:
  port: 8080
  tomcat:
    threads:
      max: 250
      min-spare: 20
    accept-count: 300

app:
  exams:
    expiry-check-ms: 15000
    expiry-batch-size: 100
    expiry-max-batches: 20
    expiry-run-budget-ms: 5000
  redis:
    enabled: ${HNEXAM_REDIS_ENABLED:false}
    key-prefix: ${HNEXAM_REDIS_KEY_PREFIX:hnexam}
  cache:
    auth-ttl-seconds: 300
  login:
    max-failures: 8
    failure-window-seconds: 900
  jwt:
    secret: ${HNEXAM_JWT_SECRET:}
    ttl-seconds: 28800
  bootstrap:
    import-legacy-candidates: ${HNEXAM_IMPORT_LEGACY_CANDIDATES:false}
    admin-password: ${HNEXAM_BOOTSTRAP_PASSWORD:Admin@12345}
    candidate-password: ${HNEXAM_CANDIDATE_PASSWORD:Candidate@12345}
    question-bank-path: ${HNEXAM_QUESTION_BANK_PATH:E:/xwechat_files/wxid_rvriaxpboxy022_cc7c/msg/file/2026-09/华能山阴发电有限责任公司安规考试题库.docx}
  web:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,https://wrap-calendars-armstrong-poor.trycloudflare.com,https://applies-generated-ruled-strengths.trycloudflare.com"

  ai:
    api-key: ${HNEXAM_AI_API_KEY:}
    master-key-file: ${HNEXAM_AI_MASTER_KEY_FILE:../.local/ai-master.key}
    limits:
      max-concurrent: ${HNEXAM_AI_MAX_CONCURRENT:8}
      user-max-concurrent: ${HNEXAM_AI_USER_MAX_CONCURRENT:1}
      daily-calls: ${HNEXAM_AI_DAILY_CALLS:20000}
      user-daily-calls: ${HNEXAM_AI_USER_DAILY_CALLS:200}
      max-input-chars: ${HNEXAM_AI_MAX_INPUT_CHARS:16000}
      max-output-tokens: ${HNEXAM_AI_MAX_OUTPUT_TOKENS:4096}
      timeout-seconds: ${HNEXAM_AI_TIMEOUT_SECONDS:60}
