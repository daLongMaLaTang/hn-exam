server {
    listen 80;
    server_name hqhexam.cn;
    root /www/wwwroot/hqhexam.cn;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://hqhexam.cn$request_uri; }
}

server {
    listen 443 ssl;
    server_name hqhexam.cn;
    root /www/wwwroot/hqhexam.cn;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/hqhexam.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hqhexam.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hnexamSSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 12m;
    access_log /www/wwwlogs/hqhexam.cn.log;
    error_log /www/wwwlogs/hqhexam.cn.error.log;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
